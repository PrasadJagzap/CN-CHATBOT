<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NetBot - Computer Network Assistant</title>
<style>
:root{
  --bg:#F2F3F7; --surface:#fff; --surface2:#F0F1F6; --fill:#E6E8EF; --fg:#1B1C21; --muted:#6B6E7A; --line:#E3E5EC;
  --accent:#0A6CF0; --accent-soft:#E6F0FF; --ok:#23975A; --bad:#D93A30; --bad-soft:#FDE6E4; --warn:#D98200;
  --code-bg:#F6F7FB; --shadow:0 1px 2px rgba(25,30,50,.04),0 6px 20px rgba(25,30,50,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.32,.72,0,1); --r-lg:24px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1117; --surface:#1A1D26; --surface2:#232733; --fill:#2A2F3D; --fg:#ECEEF4; --muted:#9097A8; --line:#2C3140;
  --accent:#5AA2FF; --accent-soft:#16294A; --bad-soft:#3A1B1A; --code-bg:#12151C; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:0 16px}
header{display:flex;align-items:center;gap:12px;padding:14px 0}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#4C9BFF,#0A6CF0);display:grid;place-items:center;box-shadow:0 6px 16px rgba(10,108,240,.28);flex:none}
header h1{margin:0;font:700 20px/1.1 var(--font);letter-spacing:-.02em}
header p{margin:2px 0 0;font:500 12px var(--font);color:var(--muted)}
.sp{flex:1}
.btn{background:var(--fill);border:0;padding:8px 15px;border-radius:999px;cursor:pointer;font-weight:550;transition:transform .3s var(--ease),background .2s}
.btn:active:not(:disabled){transform:scale(.95)}
.btn.pri{background:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.shell{flex:1;min-height:0;display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;padding-bottom:16px}
nav{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:2px;align-self:start;max-height:100%;overflow:auto}
nav h2{margin:8px 12px 4px;font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
nav button{background:none;border:0;border-radius:var(--r-sm);padding:9px 12px;text-align:left;cursor:pointer;font-weight:550}
nav button:hover{background:var(--surface2)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
nav .sep{height:1px;background:var(--line);margin:6px 10px}
main{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.status{display:flex;align-items:center;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line);font:500 12px var(--mono);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.dot.ready{background:var(--ok)} .dot.offline{background:var(--bad)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{display:flex;animation:rise .4s var(--ease) both}
.msg.user{justify-content:flex-end}
.bubble{max-width:min(720px,88%);padding:11px 15px;border-radius:20px;overflow-wrap:anywhere}
.user .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:6px;white-space:pre-wrap}
.bot .bubble{background:var(--surface2);border-bottom-left-radius:6px}
.err .bubble{background:var(--bad-soft);color:var(--bad)}
.bubble p{margin:0 0 9px} .bubble p:last-child,.bubble ul:last-child,.bubble ol:last-child{margin-bottom:0}
.bubble ul,.bubble ol{margin:0 0 9px;padding-left:22px;display:grid;gap:3px}
.bubble code{font:13px var(--mono);background:var(--fill);padding:1px 6px;border-radius:6px}
.bubble pre{margin:8px 0;background:var(--code-bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow-x:auto;font:13px/1.5 var(--mono);position:relative}
.bubble pre code{background:none;padding:0}
.copy{position:absolute;top:6px;right:6px;background:var(--fill);border:0;border-radius:8px;padding:2px 8px;font:11px var(--mono);cursor:pointer;color:var(--muted)}
.typing{display:flex;gap:5px;padding:15px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.qchips{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 10px;scrollbar-width:none}
.chip{flex:none;background:var(--surface2);border:0;padding:7px 14px;border-radius:999px;cursor:pointer;font-size:13px}
.chip:hover:not(:disabled){color:var(--accent)} .chip:disabled{opacity:.5}
.composer{display:flex;gap:10px;align-items:flex-end;padding:10px 14px 14px;border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;border:0;background:var(--fill);border-radius:20px;padding:11px 16px;max-height:140px;outline:none}
.composer textarea:focus{box-shadow:0 0 0 3px rgba(10,108,240,.25)}
.send{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center}
.send.stop{background:var(--fg);color:var(--surface)}
.send:disabled{opacity:.4}
/* subnet calculator */
dialog{border:0;border-radius:var(--r-lg);background:var(--surface);color:var(--fg);box-shadow:0 18px 60px rgba(0,0,0,.35);width:min(520px,calc(100% - 32px));padding:22px}
dialog::backdrop{background:rgba(10,12,20,.45);backdrop-filter:blur(4px)}
dialog h3{margin:0 0 4px;font:700 19px var(--font)} dialog p{margin:0 0 14px;color:var(--muted);font-size:13px}
.srow{display:flex;gap:8px}
.srow input{flex:1;border:0;background:var(--fill);border-radius:12px;padding:10px 14px;font:14px var(--mono);outline:none}
.srow input:focus{box-shadow:0 0 0 3px rgba(10,108,240,.25)}
.res{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:16px 0 0;font-size:14px}
.res dt{color:var(--muted)} .res dd{margin:0;font-family:var(--mono);overflow-wrap:anywhere}
.serr{color:var(--bad);margin-top:12px;font-size:13px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr;gap:12px}
  nav{flex-direction:row;overflow-x:auto;padding:6px;align-self:auto}
  nav h2,nav .sep{display:none} nav button{white-space:nowrap}
  .bubble{max-width:94%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="19" r="2.2"/><circle cx="19" cy="19" r="2.2"/><path d="M12 7.2v4.3M12 11.5l-5.4 5.6M12 11.5l5.4 5.6"/></svg></div>
    <div><h1>NetBot</h1><p>Computer Network Assistant</p></div>
    <span class="sp"></span>
    <button class="btn" id="calcBtn" type="button">Subnet calculator</button>
    <button class="btn" id="clearBtn" type="button">New chat</button>
  </header>
  <div class="shell">
    <nav id="topics" aria-label="Topics"><h2>Topics</h2></nav>
    <main>
      <div class="status"><span class="dot" id="dot"></span><span id="stxt">Checking connection...</span></div>
      <div class="msgs" id="msgs" role="log" aria-live="polite"></div>
      <div class="qchips" id="chips"></div>
      <div class="composer">
        <textarea id="cin" rows="1" aria-label="Message" placeholder="Ask anything about computer networks..."></textarea>
        <button class="send" id="sendbtn" type="button" aria-label="Send"></button>
      </div>
    </main>
  </div>
</div>

<dialog id="calc">
  <h3>Subnet calculator</h3>
  <p>Enter CIDR (<code>192.168.1.100/26</code>) or address and mask (<code>10.0.0.5 255.255.255.0</code>). IPv6 works too.</p>
  <form method="dialog" class="srow" id="cform">
    <input id="cinp" autocomplete="off" spellcheck="false" placeholder="192.168.1.100/26" aria-label="Address and prefix">
    <button class="btn pri" id="cgo" type="submit" value="calc">Calculate</button>
  </form>
  <div id="cout"></div>
  <p style="margin:16px 0 0;text-align:right"><button class="btn" id="cclose" type="button">Close</button></p>
</dialog>

<script>
(function(){
'use strict';
var TOPICS = [
  ['general','General'],['osi','OSI & TCP/IP'],['ip','IP & Subnetting'],['transport','TCP & UDP'],
  ['routing','Routing & Switching'],['apps','DNS, DHCP, HTTP'],['security','Security'],['wireless','Wi-Fi & LAN']
];
var CHIPS = {
  general:['Explain OSI vs TCP/IP','What happens when I type a URL?','Hub vs switch vs router','Troubleshoot: no internet'],
  osi:['Explain the 7 OSI layers','Encapsulation example','Which layer is a router?','Compare OSI and TCP/IP'],
  ip:['Subnet 192.168.10.0/24 into 4 subnets','What is VLSM?','Public vs private IPs','Explain IPv6 addresses'],
  transport:['TCP vs UDP','Explain the 3-way handshake','How does TCP congestion control work?','Flow control vs congestion control'],
  routing:['Static vs dynamic routing','Explain OSPF','Explain BGP simply','How does a switch learn MACs?'],
  apps:['How does DNS resolution work?','Explain DHCP DORA','HTTP vs HTTPS','What is NAT/PAT?'],
  security:['How does TLS work?','Explain a firewall','ARP spoofing and defence','What is a VPN?'],
  wireless:['CSMA/CD vs CSMA/CA','2.4 GHz vs 5 GHz','WPA2 vs WPA3','What is a VLAN?']
};
var $ = function(s){ return document.querySelector(s); };
var state = {key:'checking', model:'', provider:'', topic:'general', msgs:[], busy:false, ctl:null};
var SKEY = 'netbot.chat.v1';

function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function il(t){ return esc(t).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>'); }
function mdText(s){
  var out = [];
  s.split(/\n{2,}/).forEach(function(b){
    b = b.replace(/^\n+|\n+$/g,''); if (!b) return;
    var L = b.split('\n');
    if (L.every(function(l){ return /^\s*[-*]\s+/.test(l); })) out.push('<ul>'+L.map(function(l){ return '<li>'+il(l.replace(/^\s*[-*]\s+/,''))+'</li>'; }).join('')+'</ul>');
    else if (L.every(function(l){ return /^\s*\d+[.)]\s+/.test(l); })) out.push('<ol>'+L.map(function(l){ return '<li>'+il(l.replace(/^\s*\d+[.)]\s+/,''))+'</li>'; }).join('')+'</ol>');
    else if (/^#{1,4}\s/.test(b)) out.push('<p><b>'+il(b.replace(/^#{1,4}\s+/,''))+'</b></p>');
    else out.push('<p>'+L.map(il).join('<br>')+'</p>');
  });
  return out.join('');
}
function md(s){
  var out = '';
  s.split('```').forEach(function(p,i){
    if (i % 2 === 1){ var nl = p.indexOf('\n'); out += '<pre><code>'+esc((nl > -1 ? p.slice(nl+1) : p).replace(/\n$/,''))+'</code></pre>'; }
    else out += mdText(p);
  });
  return out;
}
function addCopyButtons(root){
  root.querySelectorAll('pre:not([data-c])').forEach(function(pre){
    pre.setAttribute('data-c','1');
    var b = document.createElement('button'); b.type = 'button'; b.className = 'copy'; b.textContent = 'Copy';
    b.addEventListener('click', function(){
      var t = pre.querySelector('code').textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ b.textContent = 'Copied'; setTimeout(function(){ b.textContent = 'Copy'; },1200); }, function(){});
    });
    pre.appendChild(b);
  });
}
function row(role, text){
  var d = document.createElement('div'), b = document.createElement('div');
  d.className = 'msg '+(role === 'user' ? 'user' : 'bot'); b.className = 'bubble';
  if (role === 'user') b.textContent = text; else { b.innerHTML = md(text); addCopyButtons(b); }
  d.appendChild(b); return {row:d, bub:b};
}
function typing(){
  var d = document.createElement('div'), b = document.createElement('div');
  d.className = 'msg bot'; b.className = 'bubble typing'; b.setAttribute('aria-label','NetBot is typing');
  b.innerHTML = '<i></i><i></i><i></i>'; d.appendChild(b); return {row:d, bub:b};
}
function scrollEnd(force){ var l = $('#msgs'); if (force || l.scrollHeight - l.scrollTop - l.clientHeight < 160){ l.style.scrollBehavior = 'auto'; l.scrollTop = l.scrollHeight; l.style.scrollBehavior = ''; } }
function save(){ try { sessionStorage.setItem(SKEY, JSON.stringify({topic:state.topic, msgs:state.msgs.slice(-40)})); } catch(e){} }
function load(){ try { var o = JSON.parse(sessionStorage.getItem(SKEY) || 'null'); if (o){ state.topic = o.topic || 'general'; state.msgs = (o.msgs || []).filter(function(m){ return m && m.content; }); } } catch(e){} }

function hello(){
  var t = TOPICS.filter(function(x){ return x[0] === state.topic; })[0][1];
  return 'Hi, I am **NetBot**. Ask me anything about computer networks: models, IP and subnetting, TCP/UDP, routing, DNS, security and troubleshooting. Current topic: **'+t+'**. Pick a suggestion below or type your own question.';
}
function renderAll(){
  var l = $('#msgs'); l.replaceChildren(row('bot', hello()).row);
  state.msgs.forEach(function(m){ l.appendChild(row(m.role, m.content).row); });
  scrollEnd(true);
}
function renderTopics(){
  var nav = $('#topics'); nav.querySelectorAll('button').forEach(function(b){ b.remove(); });
  TOPICS.forEach(function(t){
    var b = document.createElement('button'); b.type = 'button'; b.textContent = t[1];
    if (t[0] === state.topic) b.setAttribute('aria-current','true');
    b.addEventListener('click', function(){ state.topic = t[0]; save(); renderTopics(); renderChips(); renderAll(); });
    nav.appendChild(b);
  });
}
function renderChips(){
  var c = $('#chips'); c.replaceChildren();
  (CHIPS[state.topic] || []).forEach(function(q){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = q; b.disabled = state.busy;
    b.addEventListener('click', function(){ send(q); }); c.appendChild(b);
  });
}
function renderStatus(){
  var d = $('#dot'), t = $('#stxt');
  d.className = 'dot '+(state.key === 'ready' ? 'ready' : state.key === 'offline' ? 'offline' : '');
  t.textContent = state.key === 'ready' ? 'AI connected: '+state.provider+' · '+state.model
    : state.key === 'nokey' ? 'Offline mode: built-in notes + subnet calculator. Add a key to .env for full AI answers.'
    : state.key === 'offline' ? 'Cannot reach the local server. Start it with: python3 server.py'
    : 'Checking connection...';
}
function composer(){
  var sb = $('#sendbtn'), ta = $('#cin');
  sb.className = 'send'+(state.busy ? ' stop' : '');
  sb.setAttribute('aria-label', state.busy ? 'Stop' : 'Send');
  sb.disabled = state.key === 'offline' || state.key === 'checking';
  ta.disabled = state.key === 'offline';
  sb.innerHTML = state.busy
    ? '<svg width="14" height="14" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  document.querySelectorAll('.chip').forEach(function(c){ c.disabled = state.busy || sb.disabled; });
}
async function post(url, body, signal){
  var res = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},signal:signal,body:JSON.stringify(body)});
  if (!res.ok){ var j = await res.json().catch(function(){ return {}; }); throw new Error(j.error || ('Request failed ('+res.status+')')); }
  return res;
}
async function send(text){
  text = (text || '').trim();
  if (!text || state.busy || state.key === 'offline' || state.key === 'checking') return;
  var bot = {role:'assistant', content:''};
  state.msgs.push({role:'user', content:text}, bot);
  var l = $('#msgs'), u = row('user', text), b = typing();
  l.append(u.row, b.row); scrollEnd(true);
  state.busy = true; composer();
  var ctl = new AbortController(); state.ctl = ctl; var started = false;
  function paint(){
    if (!started){ started = true; var r = row('bot', bot.content); b.row.replaceWith(r.row); b = r; }
    else { b.bub.innerHTML = md(bot.content); addCopyButtons(b.bub); }
    scrollEnd(false);
  }
  var history = state.msgs.slice(0,-1).slice(-20);
  try {
    if (state.key === 'ready'){
      var res = await post('/api/chat',{topic:state.topic, messages:history}, ctl.signal);
      var rd = res.body.getReader(), dec = new TextDecoder(), buf = '';
      for (;;){
        var r = await rd.read(); if (r.done) break;
        buf += dec.decode(r.value,{stream:true});
        var lines = buf.split('\n'); buf = lines.pop();
        for (var k = 0; k < lines.length; k++){
          var ln = lines[k].trim(); if (ln.indexOf('data:') !== 0) continue;
          var data = ln.slice(5).trim(); if (!data || data === '[DONE]') continue;
          try { var o = JSON.parse(data), d = o.choices && o.choices[0] && o.choices[0].delta && o.choices[0].delta.content; if (d){ bot.content += d; paint(); } } catch(e){}
        }
      }
      if (!bot.content) throw new Error('The AI sent an empty reply. Try again.');
    } else {
      var j = await (await post('/api/offline',{messages:history}, ctl.signal)).json();
      bot.content = j.answer; paint();
    }
  } catch(err){
    if (err && err.name === 'AbortError'){
      if (bot.content){ bot.content += '\n\n(stopped)'; paint(); } else { state.msgs.splice(-2); b.row.remove(); u.row.remove(); }
    } else {
      state.msgs.splice(-2);
      var e = row('bot',''); e.bub.textContent = (err && err.message) || 'Something went wrong.'; e.row.classList.add('err');
      b.row.replaceWith(e.row);
    }
  }
  state.busy = false; state.ctl = null; composer(); renderChips(); save();
}
function fit(){ var t = $('#cin'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight,140)+'px'; }
function submit(){
  if (state.busy){ if (state.ctl) state.ctl.abort(); return; }
  var t = $('#cin'), v = t.value; t.value = ''; fit(); send(v);
}

/* subnet calculator */
var LABELS = [['address','Address'],['netmask','Netmask'],['wildcard','Wildcard'],['binaryMask','Mask (binary)'],['network','Network'],['broadcast','Broadcast'],['first','First host'],['last','Last host'],['usable','Usable hosts'],['total','Total addresses'],['class','Class'],['private','Private']];
async function calc(){
  var out = $('#cout'), v = $('#cinp').value.trim(); out.replaceChildren(); if (!v) return;
  try {
    var i = await (await post('/api/subnet',{input:v})).json();
    var dl = document.createElement('dl'); dl.className = 'res';
    LABELS.forEach(function(x){
      if (i[x[0]] === undefined) return;
      var dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = x[1];
      var val = i[x[0]]; dd.textContent = x[0] === 'address' ? val+i.cidr : (typeof val === 'boolean' ? (val ? 'Yes' : 'No') : (typeof val === 'number' ? val.toLocaleString() : val));
      dl.append(dt, dd);
    });
    out.appendChild(dl);
  } catch(e){ var p = document.createElement('div'); p.className = 'serr'; p.textContent = e.message; out.appendChild(p); }
}

function init(){
  load(); renderTopics(); renderChips(); renderAll(); renderStatus(); composer();
  $('#sendbtn').addEventListener('click', submit);
  $('#cin').addEventListener('input', fit);
  $('#cin').addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); submit(); } });
  $('#clearBtn').addEventListener('click', function(){ if (state.ctl) state.ctl.abort(); state.msgs = []; save(); renderAll(); });
  var dlg = $('#calc');
  $('#calcBtn').addEventListener('click', function(){ dlg.showModal(); $('#cinp').focus(); });
  $('#cclose').addEventListener('click', function(){ dlg.close(); });
  $('#cform').addEventListener('submit', function(e){ e.preventDefault(); calc(); });
  fetch('/api/health').then(function(r){ return r.json(); }).then(function(h){
    state.key = h.hasKey ? 'ready' : 'nokey'; state.model = h.model; state.provider = h.provider;
  }).catch(function(){ state.key = 'offline'; }).then(function(){ renderStatus(); composer(); });
}
init();
})();
</script>
</body>
</html>
